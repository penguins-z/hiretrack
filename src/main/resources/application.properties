spring.application.name=hiretrack

# Database connection
#spring.datasource.url=jdbc:postgresql://localhost:5432/hiretrack
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#--------spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect ----------

# Server port
server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.config.import=optional:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hiretrack}

